name: Windows app

# Every push to main builds the .exe and attaches it to the run as a download.
# Pushing a tag like v1.0.0 also publishes it on the repository's Releases page,
# which is where friends should download it from.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Build the portable .exe
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: ARAM-Group-Tracker-windows
          path: dist-desktop/*.exe
          if-no-files-found: error

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*.exe
          generate_release_notes: true
